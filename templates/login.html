<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proposed System - Login</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: #2c3e50; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .login-card { background: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); width: 100%; max-width: 400px; text-align: center; }
        .login-card h2 { color: #2c3e50; margin-bottom: 5px; }
        .login-card p { color: #7f8c8d; margin-bottom: 25px; font-size: 0.9rem; }
        input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px; font-size: 16px; }
        input:focus { outline: none; border-color: #3498db; box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.2); }
        .password-wrapper { position: relative; width: 100%; margin-bottom: 15px; }
        .password-wrapper input { margin-bottom: 0; padding-right: 44px; }
        .toggle-password-btn {
            position: absolute;
            right: 4px;
            top: 50%;
            transform: translateY(-50%);
            width: 38px !important;
            height: 38px !important;
            padding: 0 !important;
            background: transparent !important;
            color: #7f8c8d !important;
            border: none !important;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s, background-color 0.2s;
        }
        .toggle-password-btn:hover {
            background-color: rgba(0, 0, 0, 0.06) !important;
            color: #2c3e50 !important;
        }
        .toggle-password-btn:focus {
            outline: none;
            background-color: rgba(52, 152, 219, 0.1) !important;
            color: #3498db !important;
        }
        .btn-submit { width: 100%; padding: 12px; background-color: #3498db; color: white; border: none; border-radius: 4px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.3s; }
        .btn-submit:hover { background-color: #2980b9; }
        .error { color: #e74c3c; margin-bottom: 15px; font-size: 0.9rem; display: none; font-weight: bold; }
        @media (max-width: 900px) {
            .mobile-hide { display: none !important; }
            body { min-height: 100vh; min-height: 100dvh; height: auto; padding: 30px 20px calc(50px + env(safe-area-inset-bottom, 0px)) 20px; overflow-y: auto; }
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>Proposed System</h2>
        <p>Offline Inventory & Distribution System</p>

        <div class="error" id="errorMsg">Invalid credentials.</div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <input type="text" id="username" placeholder="Username" required autocomplete="username">
            <div class="password-wrapper">
                <input type="password" id="password" placeholder="Password" required autocomplete="current-password">
                <button type="button" class="toggle-password-btn" id="togglePasswordBtn" onclick="togglePasswordVisibility()" title="Show Password" aria-label="Show password">
                    <svg id="eyeIcon" class="eye-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                </button>
            </div>
            <button type="submit" id="loginBtn" class="btn-submit">Sign In</button>
        </form>
    </div>

<script>
    // Clear any old sessions on the login page
    localStorage.removeItem('bookletlog_user');
    localStorage.removeItem('bookletlog_active_pack');

    function togglePasswordVisibility() {
        const passwordInput = document.getElementById('password');
        const toggleBtn = document.getElementById('togglePasswordBtn');
        if (!passwordInput || !toggleBtn) return;

        const isPassword = passwordInput.type === 'password';
        passwordInput.type = isPassword ? 'text' : 'password';

        toggleBtn.setAttribute('title', isPassword ? 'Hide Password' : 'Show Password');
        toggleBtn.setAttribute('aria-label', isPassword ? 'Hide Password' : 'Show Password');

        if (isPassword) {
            // Slashed eye icon (click to hide)
            toggleBtn.innerHTML = `
                <svg id="eyeIcon" class="eye-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                    <line x1="1" y1="1" x2="23" y2="23"></line>
                </svg>
            `;
        } else {
            // Open eye icon (click to show)
            toggleBtn.innerHTML = `
                <svg id="eyeIcon" class="eye-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                </svg>
            `;
        }
        passwordInput.focus();
    }

    function handleLogin(event) {
        event.preventDefault();
        
        const user = document.getElementById('username').value;
        const pass = document.getElementById('password').value;
        const btn = document.getElementById('loginBtn');
        const errorMsg = document.getElementById('errorMsg');

        btn.innerText = "Authenticating...";
        btn.disabled = true;
        errorMsg.style.display = "none";

        fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: user, password: pass })
        })
        .then(response => response.json())
        .then(data => {
            if(data.status === "success") {
                // Save the session securely to the device
                localStorage.setItem('bookletlog_user', JSON.stringify(data.user));
                
                // Route them to the correct dashboard based on role
                if (data.user.role === 'Admin') {
                    window.location.href = '/dashboard';
                } else {
                    window.location.href = '/distribution';
                }
            } else {
                errorMsg.innerText = data.message;
                errorMsg.style.display = "block";
                btn.innerText = "Sign In";
                btn.disabled = false;
            }
        });
    }
</script>
</body>
</html>
